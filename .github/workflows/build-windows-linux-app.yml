name: Build Windows/Linux app

# Pounce for Windows and Linux: an Electrobun app hosting the bridge and the
# full Pounce UI. macOS ships the native app from desktop/ instead — but it is
# still built here, because the Electrobun auto-update channel needs every
# platform's update.json published together, and macOS installs from before the
# native app existed still read it. That macOS build is update plumbing only and
# must never be published as a user-facing download: for a while it was, as a
# second `Pounce.dmg` sitting beside the real one under a different release, and
# there was no way for anyone to tell which was the app.
#
# This does NOT publish. release.yml calls it, calls the macOS builder alongside
# it, and publishes everything as one release. Versions come from version.json.
#
# Runnable on its own from the Actions tab to check all four platforms build.
on:
  workflow_call:
    inputs:
      version:
        description: "App version, from version.json"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "App version to build as (defaults to version.json)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Build what we can even if one platform fails, so one bad leg still
      # yields three sets of logs. Nothing partial ships: release.yml needs this
      # whole workflow to succeed before it publishes, and a release missing a
      # platform's update.json would strand that platform's updaters.
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            slug: macos-arm64
          - os: ubuntu-22.04 # oldest LTS runner = oldest glibc = widest compat
            slug: linux-x64
          - os: ubuntu-22.04-arm
            slug: linux-arm64
          - os: windows-latest
            slug: win-x64
    runs-on: ${{ matrix.os }}
    # `secrets` is not available in step-level `if:` — referencing it there makes
    # GitHub reject the whole workflow at parse time (startup_failure on every
    # run). Hoist the "is signing configured?" check into a job-level env var and
    # gate the signing steps on that instead. (macOS only; Windows/Linux builds
    # are unsigned.)
    env:
      HAS_SIGNING_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        # bash everywhere (git-bash on the Windows runner) so the steps below
        # are written once, not per-shell.
        shell: bash
        working-directory: bridge-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # electrobun.config.ts's version is stamped into the app and compared by
      # the updater; package.json's is what the build reads. Both are stamped
      # copies of version.json (scripts/set-app-version.mjs). If any of the three
      # disagree, the release says one version and installed apps believe
      # another — so fail here, before a four-platform build, not after.
      - name: Check version consistency
        run: |
          WANT="${{ inputs.version }}"
          [ -n "$WANT" ] || WANT=$(node -p "require('../version.json').app")
          PKG=$(node -p "require('./package.json').version")
          CFG=$(grep -oE 'version: *"[^"]+"' electrobun.config.ts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version.json=$WANT  package.json=$PKG  electrobun.config.ts=$CFG"
          if [ "$PKG" != "$WANT" ] || [ "$CFG" != "$WANT" ]; then
            echo "::error::version mismatch — run 'bun run version:set $WANT'"
            exit 1
          fi

      - run: bun install

      # Workspace deps at the repo root so `sync-server` can bundle the bridge's
      # workspace imports (e.g. @litter/transcript) into a self-contained server.mjs.
      #
      # --ignore-scripts, because the linux-arm64 runner cannot build them and
      # nothing here needs them built. The root package has no runtime deps at
      # all: the only packages with install scripts that reach it are
      # @swmansion/argent's native ones (tree-sitter, node-pty, electron), and
      # argent is agent tooling that no shipped artifact touches. Compiling
      # tree-sitter through node-gyp is what failed the arm64 leg of
      # bridge-v1.1.6 twice — once on a missing bunx node-gyp, once on
      # "failed copying files from cache" for tar — while x64, macOS and Windows
      # passed the identical step. Every dependency the bridge actually bundles
      # (zigpty, @wterm/core, node-machine-id) ships prebuilt and has no install
      # script, so the resolved tree is unchanged; only the native compile of
      # tooling we don't ship goes away.
      - name: Install workspace deps
        working-directory: ${{ github.workspace }}
        run: bun install --ignore-scripts

      # Expo web export, served by the bridge at GET /. Skipped on macOS where
      # the native app is the UI (electrobun.config.ts skips the copy there
      # too — this condition just saves the export time).
      - name: Build web app
        if: ${{ matrix.slug != 'macos-arm64' }}
        working-directory: ${{ github.workspace }}/bridge-desktop
        run: bun run sync-web

      # pounce-tunnel (apps/tunnel): iroh p2p tunnel for off-LAN access. Built
      # per-platform and bundled with the app; on first run the shell installs
      # it to ~/.pounce/bin where the bridge auto-spawns it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build pounce-tunnel
        working-directory: ${{ github.workspace }}/apps/tunnel
        run: |
          cargo build --release
          mkdir -p "${{ github.workspace }}/bridge-desktop/assets"
          BIN=target/release/pounce-tunnel
          [ "${{ matrix.slug }}" = "win-x64" ] && BIN=target/release/pounce-tunnel.exe
          cp "$BIN" "${{ github.workspace }}/bridge-desktop/assets/pounce-tunnel"

      # Notarization rejects any bundled executable without the hardened
      # runtime, and electrobun only deep-signs what it knows about — sign the
      # tunnel binary explicitly (below, after the cert import) before packaging.
      - name: Import signing certificate
        if: ${{ matrix.slug == 'macos-arm64' && env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CERT_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERT_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Prepare notarization key
        if: ${{ matrix.slug == 'macos-arm64' }}
        env:
          APPLEAPIKEY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
        run: |
          if [ -n "$APPLEAPIKEY_P8" ]; then
            echo "$APPLEAPIKEY_P8" | base64 --decode > /tmp/asc_key.p8
          fi

      # Notarization rejects bundled executables without the hardened runtime;
      # sign the tunnel binary from build.keychain (created above) and pin the
      # keychain open — it auto-locks after 300s and electrobun signs later too.
      # Notarization inspects EVERY executable in the bundle, so both natives we
      # add ourselves must be signed before electrobun packages them: the tunnel
      # binary, and zigpty's .node addon. Signing them in place (assets/ and
      # node_modules/) means the copies electrobun makes are already signed.
      - name: Sign bundled natives (hardened runtime)
        if: ${{ matrix.slug == 'macos-arm64' && env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          security unlock-keychain -p "$CERT_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security find-identity -v -p codesigning build.keychain
          ID=$(security find-identity -v -p codesigning build.keychain | awk '/[0-9A-F]{40}/ {print $2; exit}')
          test -n "$ID"
          sign() {
            codesign --force --options runtime --timestamp \
              --keychain build.keychain --sign "$ID" "$1"
            codesign --verify --strict "$1"
          }
          sign assets/pounce-tunnel
          # Only the host's prebuild is bundled (see zigptyPrebuilds() in
          # electrobun.config.ts), so only that one needs a signature.
          PREBUILD="../node_modules/zigpty/prebuilds/zigpty.darwin-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/').node"
          test -f "$PREBUILD" || { echo "::error::missing $PREBUILD"; exit 1; }
          sign "$PREBUILD"

      # The signing/notarization env vars are only set on the macOS job; the
      # electrobun config keys code signing off their presence, so Windows and
      # Linux build unsigned without any extra gating.
      - name: Build (stable)
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_DEVELOPER_ID || '' }}
          ELECTROBUN_TEAMID: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_TEAMID || '' }}
          ELECTROBUN_APPLEAPIKEYPATH: ${{ matrix.slug == 'macos-arm64' && '/tmp/asc_key.p8' || '' }}
          ELECTROBUN_APPLEAPIKEY: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_APPLEAPIKEY || '' }}
          ELECTROBUN_APPLEAPIISSUER: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_APPLEAPIISSUER || '' }}
        run: bun run build:stable

      # A .deb so Ubuntu users get a double-clickable package instead of a
      # tarball and a shell script. Only on Linux; nfpm builds it from the app
      # bundle (see packaging/build-deb.sh for why not from the installer).
      - name: Install nfpm
        if: ${{ startsWith(matrix.slug, 'linux-') }}
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build .deb
        if: ${{ startsWith(matrix.slug, 'linux-') }}
        run: |
          SLUG="${{ matrix.slug }}"
          bash packaging/build-deb.sh "${SLUG#linux-}"

      # Friendly download names alongside the prefixed auto-update artifacts.
      # These go in a `downloads/` subdirectory so the publish job can tell a
      # human-facing installer from update plumbing by path alone — previously
      # both were flat in artifacts/ and the release step uploaded the lot,
      # burying four installers under fourteen `stable-*` files.
      #
      # macOS is deliberately absent. Its user-facing app is the native one from
      # desktop/; the Electrobun macOS build here exists only to keep the
      # auto-update channel complete, so it stays under `stable-macos-arm64-*`
      # and is never offered as a download.
      #
      # Windows ships the whole zip, NOT the .exe inside it. That .exe is a
      # ~400KB launcher; the app is the 40MB `.installer/Pounce-Setup.tar.zst`
      # sitting beside it. This step used to unwrap the zip and publish the bare
      # launcher on the theory that it was "the installer itself" — so every
      # Windows download was a stub that could not install anything, and Windows
      # was quietly the one platform where Pounce did not work at all.
      - name: Add clean-named installer
        env:
          V: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/downloads
          case "${{ matrix.slug }}" in
            macos-arm64) : ;;
            linux-x64)   cp artifacts/stable-linux-x64-Pounce-Setup.tar.gz   "artifacts/downloads/Pounce-$V-Linux-x64.tar.gz" ;;
            linux-arm64) cp artifacts/stable-linux-arm64-Pounce-Setup.tar.gz "artifacts/downloads/Pounce-$V-Linux-arm64.tar.gz" ;;
            win-x64)     cp artifacts/stable-win-x64-Pounce-Setup.zip        "artifacts/downloads/Pounce-$V-Windows-x64.zip" ;;
          esac

      # A launcher-sized Windows download is the signature of the bug above, so
      # assert the payload is really in there rather than trusting the copy.
      - name: The Windows download carries its payload
        if: ${{ matrix.slug == 'win-x64' }}
        env:
          V: ${{ inputs.version }}
        run: |
          ZIP="artifacts/downloads/Pounce-$V-Windows-x64.zip"
          BYTES=$(powershell -NoProfile -Command "(Get-Item '$ZIP').Length")
          echo "$ZIP is $BYTES bytes"
          if [ "$BYTES" -lt 20000000 ]; then
            echo "::error::$ZIP is ${BYTES} bytes — the app payload is missing, this would install nothing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.slug }}
          path: bridge-desktop/artifacts/*
          if-no-files-found: error
