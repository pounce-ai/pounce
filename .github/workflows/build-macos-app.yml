name: Build macOS app

# Builds, signs and notarizes the macOS Pounce app (desktop/), plus the headless
# cross-platform bridge bundle. It does NOT publish: release.yml calls this,
# calls the Windows/Linux builder alongside it, and publishes everything as one
# release. Nothing here decides a version or a tag — both arrive as inputs from
# release.yml, which reads version.json.
#
# Runnable on its own from the Actions tab to check a build without releasing.
#
# Required repo secrets (the macOS signing/notarization ones already exist from
# release-bridge.yml):
#   MAC_CERT_P12_BASE64      Developer ID Application cert (.p12), base64
#   MAC_CERT_PASSWORD        …its password
#   ELECTROBUN_DEVELOPER_ID  "Developer ID Application: … (TEAMID)"
#   ELECTROBUN_APPLEAPIKEY_P8 App Store Connect API key (.p8), base64
#   ELECTROBUN_APPLEAPIKEY   …its Key ID
#   ELECTROBUN_APPLEAPIISSUER …its Issuer ID
#   SPARKLE_ED_PRIVATE_KEY   NEW — exported Sparkle EdDSA key. Produce locally with
#                            desktop/macos/Pods/Sparkle/bin/generate_keys -x key.txt
#                            and paste key.txt's contents as the secret.
on:
  workflow_call:
    inputs:
      version:
        description: "App version, from version.json — decides the appcast's download URLs"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "App version to build as (defaults to version.json)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Cross-platform bridge bundle (repo-free; needs only Node on the target host).
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Pack bridge bundle
        run: bun run bridge:pack
      - name: Zip bundle
        run: |
          cd dist && zip -r pounce-bridge.zip pounce-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: pounce-bridge
          path: dist/pounce-bridge.zip
          if-no-files-found: error

  # Self-contained bridge (bun --compile), Apple Silicon only. The desktop app is
  # arm64-only (ARCHS = arm64 in the Xcode project) — Intel Macs are not
  # supported, so there is no x64 slice and nothing to lipo-fuse.
  #
  # The artifact is TWO things: the executable and the prebuilds/ directory
  # holding zigpty's native PTY addon. `bun --compile` cannot embed that addon
  # (see scripts/bridge/compile.mjs), so it travels beside the binary and both
  # must reach the Xcode bundling phase together.
  bridge-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Compile bridge (arm64)
        run: |
          bun run scripts/bridge/compile.mjs --target bun-darwin-arm64 --outfile "$RUNNER_TEMP/pounce-bridge-arm64"
      - name: Smoke-test arm64 — boots with no Node, and has a REAL pty
        run: |
          POUNCE_NO_CTX_INSTALL=1 BRIDGE_PORT=8137 "$RUNNER_TEMP/pounce-bridge-arm64" > /tmp/bridge-smoke.log 2>&1 &
          BP=$!
          sleep 4
          if grep -q "listening" /tmp/bridge-smoke.log; then
            echo "✓ bridge booted:"; head -3 /tmp/bridge-smoke.log
          else
            echo "::error::bridge did not boot"; cat /tmp/bridge-smoke.log; kill $BP 2>/dev/null; exit 1
          fi
          # The compiled binary cannot embed zigpty's addon, so this asserts the
          # prebuilds/ sibling was found. Booting proves nothing here: without it
          # the bridge starts perfectly happily and every PTY is a pipe.
          if grep -q "pty: native" /tmp/bridge-smoke.log; then
            echo "✓ native pty"
          else
            echo "::error::bridge has no native PTY (pipe fallback)"; cat /tmp/bridge-smoke.log; kill $BP 2>/dev/null; exit 1
          fi
          kill $BP 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-macos
          # Both paths live under runner.temp, so the artifact keeps the layout
          # (pounce-bridge-arm64 + prebuilds/) the staging step below expects.
          path: |
            ${{ runner.temp }}/pounce-bridge-arm64
            ${{ runner.temp }}/prebuilds
          if-no-files-found: error

  # Signed + notarized macOS app → DMG + Sparkle appcast.
  # macos-15 for a modern Xcode toolchain — react-native-macos's Podfile requires
  # Xcode >= 16.1 (macos-14 runners ship 15.x and `pod install` bails).
  desktop:
    needs: bridge-macos
    runs-on: macos-15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (>= 16.1 for react-native-macos)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache native compilation across runs — the from-scratch pod compile is
      # ~19 min (the whole build's bottleneck). ccache is content-addressed, so a
      # cached object is reused only when source + flags match — no stale-build
      # risk. Pod targets pick up the wrappers via the Podfile post_install
      # (USE_CCACHE=1); the app target gets them on the xcodebuild line.
      - name: Set up ccache
        run: |
          brew install ccache
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec ccache clang "$@"\n'   > "$HOME/bin/ccache-clang"
          printf '#!/bin/sh\nexec ccache clang++ "$@"\n' > "$HOME/bin/ccache-clang++"
          chmod +x "$HOME/bin/ccache-clang" "$HOME/bin/ccache-clang++"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=3G
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache --zero-stats

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # run_id makes each run save a fresh entry; restore-keys pulls the most
          # recent one. Podfile.lock in the key busts the cache when pods change.
          key: ccache-desktop-${{ hashFiles('desktop/macos/Podfile.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-desktop-${{ hashFiles('desktop/macos/Podfile.lock') }}-
            ccache-desktop-

      - name: Preflight — required secrets present
        env:
          CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          DEVID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          NKEY: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
          SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          miss=0
          for v in CERT DEVID NKEY SPARKLE; do
            if [ -z "${!v}" ]; then echo "::error::missing secret for $v"; miss=1; fi
          done
          [ "$miss" = 0 ] || { echo "Set the required secrets (see workflow header)."; exit 1; }

      - name: Install JS deps (root + desktop)
        run: |
          bun install
          cd desktop && bun install

      - name: pod install
        working-directory: desktop/macos
        run: pod install

      # Hand the prebuilt arm64 bridge to the Xcode "Bundle Pounce Bridge" phase
      # via POUNCE_BRIDGE_BIN, so the phase ships the smoke-tested binary from
      # the bridge-macos job rather than recompiling one here. The phase also
      # copies the prebuilds/ sibling, so stage that beside the binary.
      - uses: actions/download-artifact@v4
        with:
          name: bridge-macos
          path: bridge-artifacts
      - name: Stage arm64 bridge
        run: |
          OUT="$RUNNER_TEMP/bridge/pounce-bridge"
          mkdir -p "$(dirname "$OUT")"
          cp bridge-artifacts/pounce-bridge-arm64 "$OUT"
          chmod +x "$OUT"
          [ -f bridge-artifacts/prebuilds/zigpty.darwin-arm64.node ] || {
            echo "::error::bridge artifact has no zigpty prebuild — the app would have no real PTY"; exit 1
          }
          cp -R bridge-artifacts/prebuilds "$(dirname "$OUT")/prebuilds"
          ARCHS_FOUND="$(lipo -archs "$OUT")"
          echo "bridge archs: $ARCHS_FOUND"
          # Apple Silicon only — fail loudly if an x86_64 slice ever creeps back in.
          if [ "$ARCHS_FOUND" != "arm64" ]; then
            echo "::error::expected an arm64-only bridge, got: $ARCHS_FOUND"; exit 1
          fi
          echo "POUNCE_BRIDGE_BIN=$OUT" >> "$GITHUB_ENV"

      # version.json is the source of truth for every Pounce app; the plist is a
      # stamped copy (scripts/set-app-version.mjs). Disagreement here means the
      # stamp was skipped, and the appcast would advertise a version the app
      # doesn't claim — so stop before spending 20 minutes on a build.
      - name: Read and verify app version
        id: ver
        run: |
          PLIST=desktop/macos/PounceDesktop-macOS/Info.plist
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          B=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          WANT="${{ inputs.version }}"
          [ -n "$WANT" ] || WANT=$(node -p "require('./version.json').app")
          if [ "$V" != "$WANT" ]; then
            echo "::error::Info.plist says $V but the release is $WANT — run 'bun run version:set $WANT'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Pounce $V (macOS build $B)"

          # CFBundleVersion is what Sparkle compares — `sparkle:version` in the
          # appcast is generated from it, and an equal value means "no update
          # available" no matter how much CFBundleShortVersionString changed.
          # This check only ever PRINTED it, so when unified releases retired
          # the desktop-v* PRs that bumped it by hand, four releases shipped
          # advertising build 47 and every installed Mac stopped updating. The
          # neighbouring field was verified; the one that decides was not.
          PUBLISHED=$(curl -fsSL --max-time 20 \
            https://github.com/pounce-ai/pounce/releases/latest/download/appcast.xml 2>/dev/null \
            | sed -n 's/.*<sparkle:version>\([0-9][0-9]*\)<\/sparkle:version>.*/\1/p' | head -1)
          if [ -z "$PUBLISHED" ]; then
            # No appcast published yet, or GitHub is having a moment. Not worth
            # failing a release over something that is only advisory.
            echo "::warning::could not read the published appcast — skipping the build-counter check"
          elif [ "$B" -le "$PUBLISHED" ]; then
            echo "::error::CFBundleVersion is $B but the published release already advertises $PUBLISHED — Sparkle would offer no update. Bump it (bun run version:set does this) before releasing."
            exit 1
          else
            echo "build counter advances: $PUBLISHED -> $B"
          fi

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CERT_PASSWORD" build.keychain
          security set-keychain-settings build.keychain   # no auto-lock during the run
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERT_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Write notary + Sparkle keys
        env:
          NOTARY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          echo "$NOTARY_P8" | base64 --decode > /tmp/asc_key.p8
          printf '%s' "$SPARKLE_KEY" > /tmp/sparkle_ed_key.txt

      - name: Build (Release, unsigned — signed inside-out afterwards)
        working-directory: desktop/macos
        run: |
          xcodebuild -workspace PounceDesktop.xcworkspace -scheme PounceDesktop-macOS \
            -configuration Release -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO \
            CC="$HOME/bin/ccache-clang" CXX="$HOME/bin/ccache-clang++" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            build
          echo "::group::ccache stats"; ccache --show-stats; echo "::endgroup::"

      - name: Sign · DMG · notarize · appcast
        env:
          APP: desktop/macos/build-release/Build/Products/Release/Pounce.app
          SIGN_IDENTITY: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          SIGN_KEYCHAIN: build.keychain
          ENTITLEMENTS: desktop/macos/PounceDesktop-macOS/PounceDesktop.entitlements
          OUT_DMG: ${{ github.workspace }}/dist/Pounce.dmg
          APPCAST_OUT: ${{ github.workspace }}/dist/appcast.xml
          NOTARY_KEY_P8: /tmp/asc_key.p8
          NOTARY_KEY_ID: ${{ secrets.ELECTROBUN_APPLEAPIKEY }}
          NOTARY_ISSUER: ${{ secrets.ELECTROBUN_APPLEAPIISSUER }}
          GENERATE_APPCAST: desktop/macos/Pods/Sparkle/bin/generate_appcast
          SPARKLE_KEY_FILE: /tmp/sparkle_ed_key.txt
          # Must match the tag release.yml publishes, or Sparkle's appcast points
          # at a URL that 404s and macOS auto-update silently stops.
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/
        run: |
          mkdir -p dist
          bash scripts/desktop/release.sh

      - name: Scrub secret key files
        if: always()
        run: rm -f /tmp/asc_key.p8 /tmp/sparkle_ed_key.txt

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: |
            dist/Pounce.dmg
            dist/appcast.xml
          if-no-files-found: error
