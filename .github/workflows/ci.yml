name: CI

# Fast PR gate: lint, format (changed files), typecheck, and tests. Runs on
# every pull request and on pushes to main. This is the check that was missing
# when the desktop ccache + prism regressions reached main unnoticed — nothing
# ran on PRs before.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · format · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the format check can diff against the base
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install

      - name: Lint (oxlint)
        run: bun run lint

      # Incremental formatting: only enforce oxfmt on files this change touches,
      # so the pre-existing (unformatted) code isn't reformatted wholesale.
      - name: Format check (changed files)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD \
            -- '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.js' '*.jsx' | tr '\n' ' ')
          if [ -n "$files" ]; then
            echo "Checking formatting of changed files:"; echo "$files" | tr ' ' '\n'
            bunx oxfmt --check $files
          else
            echo "No changed source files to format-check."
          fi

      - name: Typecheck (workspace)
        run: bun run typecheck

      - name: Test (workspace)
        run: bun run test

  desktop-typecheck:
    name: typecheck (desktop / RN-macos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # desktop/ is its own project (own lockfile) and compiles the shared
      # @pounce/app against react-native-macos, so it type-checks it under a
      # different RN flavor than apps/mobile does.
      - name: Install (desktop)
        run: cd desktop && bun install
      - name: Typecheck
        run: cd desktop && bun run typecheck
