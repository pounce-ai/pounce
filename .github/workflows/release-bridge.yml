name: Release Bridge

# Pounce for Windows and Linux: an Electrobun tray app that hosts the bridge and
# shows its pairing UI. macOS ships the RN desktop app (desktop/) instead, but is
# built here too because the auto-update channel needs every platform's
# update.json published in the same release.
#
# Bump the version in BOTH bridge-desktop/package.json and
# bridge-desktop/electrobun.config.ts, merge, then push a `bridge-v<version>`
# tag. The resulting Release is tagged `v<version>`.
# Can also be run from the Actions tab without pushing a tag — use dry_run to
# build all four platforms and inspect the artifacts without publishing.
on:
  push:
    tags:
      - "bridge-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every platform but do NOT publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Build what we can even if one platform fails — but the release job
      # below still requires all four, so a partial set never ships (a latest
      # release missing one platform's update.json would strand its updaters).
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            slug: macos-arm64
          - os: ubuntu-22.04 # oldest LTS runner = oldest glibc = widest compat
            slug: linux-x64
          - os: ubuntu-22.04-arm
            slug: linux-arm64
          - os: windows-latest
            slug: win-x64
    runs-on: ${{ matrix.os }}
    # `secrets` is not available in step-level `if:` — referencing it there makes
    # GitHub reject the whole workflow at parse time (startup_failure on every
    # run). Hoist the "is signing configured?" check into a job-level env var and
    # gate the signing steps on that instead. (macOS only; Windows/Linux builds
    # are unsigned.)
    env:
      HAS_SIGNING_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        # bash everywhere (git-bash on the Windows runner) so the steps below
        # are written once, not per-shell.
        shell: bash
        working-directory: bridge-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The version lives in two files and both are load-bearing: package.json
      # names the GitHub release, electrobun.config.ts is stamped into the app
      # and compared by the updater. If they drift, the release says one version
      # and installed apps believe another — so fail here, before a four-platform
      # build, rather than after publishing. When a tag triggered this run, it
      # must agree too.
      - name: Check version consistency
        run: |
          PKG=$(node -p "require('./package.json').version")
          CFG=$(grep -oE 'version: *"[^"]+"' electrobun.config.ts | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "package.json=$PKG  electrobun.config.ts=$CFG  tag=${GITHUB_REF_NAME:-n/a}"
          if [ "$PKG" != "$CFG" ]; then
            echo "::error::version mismatch — package.json=$PKG but electrobun.config.ts=$CFG"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/bridge-v*)
              TAG="${GITHUB_REF_NAME#bridge-v}"
              if [ "$TAG" != "$PKG" ]; then
                echo "::error::tag bridge-v$TAG does not match version $PKG"
                exit 1
              fi
              ;;
          esac

      - run: bun install

      # Workspace deps at the repo root so `sync-server` can bundle the bridge's
      # workspace imports (e.g. @litter/transcript) into a self-contained server.mjs.
      #
      # --ignore-scripts, because the linux-arm64 runner cannot build them and
      # nothing here needs them built. The root package has no runtime deps at
      # all: the only packages with install scripts that reach it are
      # @swmansion/argent's native ones (tree-sitter, node-pty, electron), and
      # argent is agent tooling that no shipped artifact touches. Compiling
      # tree-sitter through node-gyp is what failed the arm64 leg of
      # bridge-v1.1.6 twice — once on a missing bunx node-gyp, once on
      # "failed copying files from cache" for tar — while x64, macOS and Windows
      # passed the identical step. Every dependency the bridge actually bundles
      # (zigpty, @wterm/core, node-machine-id) ships prebuilt and has no install
      # script, so the resolved tree is unchanged; only the native compile of
      # tooling we don't ship goes away.
      - name: Install workspace deps
        working-directory: ${{ github.workspace }}
        run: bun install --ignore-scripts

      # The web app (the full Pounce UI). One platform-independent Expo web
      # export; the bridge serves it at GET / so the window shows the real app
      # instead of the pairing QR (which moves to /pair). Linux/Windows only:
      # on macOS the native desktop app is the real UI and this app stays the
      # companion tray + QR (electrobun.config.ts skips the copy there too —
      # this condition just saves the export time on that leg).
      - name: Build web app
        if: ${{ matrix.slug != 'macos-arm64' }}
        working-directory: ${{ github.workspace }}/bridge-desktop
        run: bun run sync-web

      # pounce-tunnel (apps/tunnel): iroh p2p tunnel for off-LAN access. Built
      # per-platform and bundled with the app; on first run the shell installs
      # it to ~/.pounce/bin where the bridge auto-spawns it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build pounce-tunnel
        working-directory: ${{ github.workspace }}/apps/tunnel
        run: |
          cargo build --release
          mkdir -p "${{ github.workspace }}/bridge-desktop/assets"
          BIN=target/release/pounce-tunnel
          [ "${{ matrix.slug }}" = "win-x64" ] && BIN=target/release/pounce-tunnel.exe
          cp "$BIN" "${{ github.workspace }}/bridge-desktop/assets/pounce-tunnel"

      # Notarization rejects any bundled executable without the hardened
      # runtime, and electrobun only deep-signs what it knows about — sign the
      # tunnel binary explicitly (below, after the cert import) before packaging.
      - name: Import signing certificate
        if: ${{ matrix.slug == 'macos-arm64' && env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$CERT_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERT_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Prepare notarization key
        if: ${{ matrix.slug == 'macos-arm64' }}
        env:
          APPLEAPIKEY_P8: ${{ secrets.ELECTROBUN_APPLEAPIKEY_P8 }}
        run: |
          if [ -n "$APPLEAPIKEY_P8" ]; then
            echo "$APPLEAPIKEY_P8" | base64 --decode > /tmp/asc_key.p8
          fi

      # Notarization rejects bundled executables without the hardened runtime;
      # sign the tunnel binary from build.keychain (created above) and pin the
      # keychain open — it auto-locks after 300s and electrobun signs later too.
      # Notarization inspects EVERY executable in the bundle, so both natives we
      # add ourselves must be signed before electrobun packages them: the tunnel
      # binary, and zigpty's .node addon. Signing them in place (assets/ and
      # node_modules/) means the copies electrobun makes are already signed.
      - name: Sign bundled natives (hardened runtime)
        if: ${{ matrix.slug == 'macos-arm64' && env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          security unlock-keychain -p "$CERT_PASSWORD" build.keychain
          security set-keychain-settings build.keychain
          security find-identity -v -p codesigning build.keychain
          ID=$(security find-identity -v -p codesigning build.keychain | awk '/[0-9A-F]{40}/ {print $2; exit}')
          test -n "$ID"
          sign() {
            codesign --force --options runtime --timestamp \
              --keychain build.keychain --sign "$ID" "$1"
            codesign --verify --strict "$1"
          }
          sign assets/pounce-tunnel
          # Only the host's prebuild is bundled (see zigptyPrebuilds() in
          # electrobun.config.ts), so only that one needs a signature.
          PREBUILD="../node_modules/zigpty/prebuilds/zigpty.darwin-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/').node"
          test -f "$PREBUILD" || { echo "::error::missing $PREBUILD"; exit 1; }
          sign "$PREBUILD"

      # The signing/notarization env vars are only set on the macOS job; the
      # electrobun config keys code signing off their presence, so Windows and
      # Linux build unsigned without any extra gating.
      - name: Build (stable)
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_DEVELOPER_ID || '' }}
          ELECTROBUN_TEAMID: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_TEAMID || '' }}
          ELECTROBUN_APPLEAPIKEYPATH: ${{ matrix.slug == 'macos-arm64' && '/tmp/asc_key.p8' || '' }}
          ELECTROBUN_APPLEAPIKEY: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_APPLEAPIKEY || '' }}
          ELECTROBUN_APPLEAPIISSUER: ${{ matrix.slug == 'macos-arm64' && secrets.ELECTROBUN_APPLEAPIISSUER || '' }}
        run: bun run build:stable

      # A .deb so Ubuntu users get a double-clickable package instead of a
      # tarball and a shell script. Only on Linux; nfpm builds it from the app
      # bundle (see packaging/build-deb.sh for why not from the installer).
      - name: Install nfpm
        if: ${{ startsWith(matrix.slug, 'linux-') }}
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build .deb
        if: ${{ startsWith(matrix.slug, 'linux-') }}
        run: |
          SLUG="${{ matrix.slug }}"
          bash packaging/build-deb.sh "${SLUG#linux-}"

      # Friendly, stable download names alongside the prefixed auto-update
      # artifacts, so /releases/latest/download/<name> links keep working.
      #
      # Windows: Electrobun already builds a real Pounce-Setup.exe — it just
      # wraps it in a zip. Unwrap it so the download is the installer itself
      # rather than something to extract first.
      - name: Add clean-named installer
        run: |
          case "${{ matrix.slug }}" in
            macos-arm64) cp "$(ls -t artifacts/*.dmg | head -1)" artifacts/Pounce.dmg ;;
            linux-x64)   cp artifacts/stable-linux-x64-Pounce-Setup.tar.gz artifacts/Pounce-Setup-Linux-x64.tar.gz ;;
            linux-arm64) cp artifacts/stable-linux-arm64-Pounce-Setup.tar.gz artifacts/Pounce-Setup-Linux-arm64.tar.gz ;;
            win-x64)
              # Expand-Archive, not unzip: Git Bash on the Windows runner has no
              # unzip, and PowerShell is guaranteed to be there.
              powershell -NoProfile -Command \
                "Expand-Archive -Force -Path 'artifacts/stable-win-x64-Pounce-Setup.zip' -DestinationPath 'artifacts/win-setup'"
              EXE="$(find artifacts/win-setup -name '*.exe' | head -1)"
              test -n "$EXE" || { echo "::error::no .exe inside the Windows setup zip"; exit 1; }
              cp "$EXE" artifacts/Pounce-Setup-Windows.exe
              rm -rf artifacts/win-setup
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.slug }}
          path: bridge-desktop/artifacts/*
          if-no-files-found: error

  # Publish as `v{app-version}` (e.g. v1.0.8) to match releases cut locally by
  # scripts/release-bridge.sh — not the `bridge-v*` trigger tag. This keeps the
  # Releases page consistent regardless of which path built it.
  release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve app version
        id: ver
        run: echo "version=$(node -p "require('./bridge-desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach installers + auto-update artifacts to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Pounce v${{ steps.ver.outputs.version }}
          body: |
            Download the Bridge for your computer, run it, and scan the QR with the Pounce app.

            - **macOS (Apple Silicon):** `Pounce.dmg` — open, drag Pounce to Applications, launch. Signed + notarized.
            - **Windows (x64):** `Pounce-Setup-Windows.exe` — run it. Unsigned for now: if SmartScreen appears, choose *More info → Run anyway*.
            - **Ubuntu / Debian (x64 / arm64):** `Pounce-Linux-<arch>.deb` — `sudo apt install ./Pounce-Linux-<arch>.deb`, then launch Pounce from your applications menu.
            - **Other Linux (x64 / arm64):** `Pounce-Setup-Linux-<arch>.tar.gz` — extract, run `./installer` (installs to `~/.local/share` and adds a desktop entry).

            Once running, Pounce sits in the tray: it shows today's usage and your plan quota, and "Show pairing window" brings up the QR to scan.

            The `stable-*` files are auto-update artifacts — installed apps pick them up from the rolling `bridge-latest` release automatically. The `.deb` is the exception: it installs to root-owned `/opt`, which the in-place updater can't write to, so update it by installing a newer `.deb`. The `.tar.gz` install self-updates.
          files: release-assets/*
          fail_on_unmatched_files: true
          # Load-bearing: GitHub's "latest" belongs to the macOS desktop app.
          # Its Sparkle feed (SUFeedURL) resolves through
          # releases/latest/download/appcast.xml, and that URL is baked into
          # every shipped desktop build. Marking a bridge release "latest" would
          # 404 that feed and silently kill desktop auto-update until the next
          # desktop release. The bridge's own updater reads the rolling
          # `bridge-latest` release below instead, so it does not need this.
          make_latest: false

      # The rolling pointer the bridge's updater actually reads. One release,
      # re-uploaded every time, holding only the auto-update artifacts —
      # `--clobber` replaces the previous build's files in place. Electrobun
      # builds its BSDIFF delta by fetching the *previous* .tar.zst from this
      # same URL, so the assets must be replaced here rather than accumulated
      # under per-version tags.
      - name: Refresh the rolling bridge-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view bridge-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create bridge-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bridge auto-update channel" \
              --notes "Rolling update channel for the Pounce tray app. Not a download — see the versioned releases for installers." \
              --latest=false
          fi
          # Only the update manifests and payloads; installers stay on the
          # versioned release so this one never looks like a download page.
          gh release upload bridge-latest \
            --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/stable-*
          gh release edit bridge-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Rolling update channel for the Pounce tray app — currently v${{ steps.ver.outputs.version }}. Not a download; see the versioned releases for installers."
